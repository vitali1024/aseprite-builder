name: Build private Windows Aseprite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'

env:
  BUILD_TYPE: Release

jobs:
  resolve-version:
    name: Resolve latest Aseprite release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.release.outputs.release-tag }}
    steps:
      - name: Read latest Aseprite release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/aseprite/aseprite/releases/latest --jq '.tag_name')"
          test -n "$tag"
          echo "release-tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building Aseprite $tag"

  build-windows:
    name: Build Windows x64
    needs: resolve-version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Clone official Aseprite source
        shell: bash
        env:
          ASEPRITE_TAG: ${{ needs.resolve-version.outputs.release-tag }}
        run: |
          git clone --recurse-submodules -j8 \
            --branch "$ASEPRITE_TAG" \
            https://github.com/aseprite/aseprite.git aseprite

      - name: Download official Aseprite Skia build
        shell: pwsh
        working-directory: aseprite
        run: |
          $url = 'https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip'
          curl.exe -L --fail --retry 3 -o skia.zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download Skia' }
          7z x skia.zip -oskia -y
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract Skia' }
          Remove-Item skia.zip

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure Aseprite
        shell: bash
        working-directory: aseprite
        run: |
          skia_dir="$(cygpath -m "$(pwd)/skia")"
          skia_library_dir="$skia_dir/out/Release-x64"
          skia_library="$skia_library_dir/skia.lib"

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$skia_dir" \
            -DSKIA_LIBRARY_DIR="$skia_library_dir" \
            -DSKIA_LIBRARY="$skia_library"

      - name: Compile Aseprite
        shell: bash
        working-directory: aseprite
        run: cmake --build build --target aseprite

      - name: Package portable Windows build
        id: package
        shell: pwsh
        working-directory: aseprite/build/bin
        env:
          ASEPRITE_TAG: ${{ needs.resolve-version.outputs.release-tag }}
        run: |
          Set-Content -Path aseprite.ini -Value '# This file is here so Aseprite behaves as a portable program'

          $keep = @('aseprite.exe', 'aseprite.ini', 'data')
          Get-ChildItem -Force |
            Where-Object { $keep -notcontains $_.Name } |
            Remove-Item -Recurse -Force

          $asset = "Aseprite-$env:ASEPRITE_TAG-Windows-x64.zip"
          7z a -tzip $asset aseprite.exe aseprite.ini data
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create portable ZIP' }

          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Store build in a private draft release
        shell: bash
        working-directory: aseprite/build/bin
        env:
          GH_TOKEN: ${{ github.token }}
          ASEPRITE_TAG: ${{ needs.resolve-version.outputs.release-tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          existing_id="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"$ASEPRITE_TAG\") | .id" | head -n1)"

          if [[ -n "$existing_id" ]]; then
            gh api --method DELETE "repos/${{ github.repository }}/releases/$existing_id"
          fi

          gh release create "$ASEPRITE_TAG" "$ASSET" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Aseprite $ASEPRITE_TAG - private Windows build" \
            --notes "Personal self-compiled Windows x64 build of Aseprite. This release intentionally remains a draft and must not be published or redistributed."
